name: Label issues
on:
  issues:
    types: [opened, edited, reopened]
permissions:
  issues: write
  contents: read
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v3.4
        with:
          configuration-path: .github/labeler.yml
          enable-versioned-regex: 0
          include-title: 1
          repo-token: ${{ secrets.GITHUB_TOKEN }}
