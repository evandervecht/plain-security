name: Check briefings
on:
  pull_request:
    paths:
      - '**/index.html'
      - 'tools/**'
      - '.github/workflows/check-briefings.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Briefing standard (AGENTS.md) on changed pages
        # Text budget is measured against main, so stacked PRs are judged against what is live.
        run: |
          git fetch origin main
          node tools/check.mjs --changed "origin/${{ github.base_ref }}" --baseline origin/main
        env:
          CHROME: /usr/bin/google-chrome
