name: Check briefings
on:
  pull_request:
    paths:
      - '**/index.html'
      - 'tools/**'
      - '.github/workflows/check-briefings.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Briefing standard (AGENTS.md) on changed pages
        # Text budget is measured against main, so stacked PRs are judged against what is live.
        run: |
          git fetch origin main
          node tools/check.mjs --changed "origin/${{ github.base_ref }}" --baseline origin/main
        env:
          CHROME: /usr/bin/google-chrome
